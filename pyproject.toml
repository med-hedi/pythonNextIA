[project]
name = "python-next-ia"
version = "0.1.0"
description = "Base solide pour construire des API backend en Python avec FastAPI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# ---------------------------------------------------------------------------
# Ruff : linter + formateur (remplace flake8, isort, black, pyupgrade...)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (tri des imports)
    "N",        # conventions de nommage PEP 8
    "UP",       # pyupgrade (syntaxe moderne)
    "B",        # flake8-bugbear (bugs probables)
    "A",        # shadowing des builtins
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RET",      # return
    "PTH",      # pathlib plutôt que os.path
    "ASYNC",    # pièges asyncio
    "S",        # bandit (sécurité)
    "T20",      # pas de print() oublié
    "DTZ",      # datetime sans timezone
    "FAST",     # règles spécifiques FastAPI
    "RUF",      # règles propres à Ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert est normal dans les tests

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy : typage statique strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest + couverture
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]
